<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management - CampusBite Admin</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/admin-layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!-- Common Navbar -->
    <div class="nav-overlay" onclick="toggleNav()"></div>
    <nav class="navbar">
        <button class="nav-toggle-btn" onclick="toggleNav()"><i class="fa-solid fa-bars"></i></button>
        <a href="/admin/dashboard.html" class="nav-brand" style="display: flex; align-items: center;">
            <img src="/images/logo.png" alt="CampusBite Logo" style="height: 65px;">
        </a>
        <div class="nav-links">
            <div class="sidebar-logo">
                <img src="/images/logo.png" alt="CampusBite Logo" style="height: 50px;">
                <button onclick="toggleNav()" style="background: transparent; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
            </div>
            <a href="/admin/dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="/admin/menu-management.html" class="active"><i class="fa-solid fa-burger"></i> Menu Management</a>
            <a href="/admin/orders.html"><i class="fa-solid fa-receipt"></i> Orders</a>
            <a href="/admin/payments.html"><i class="fa-solid fa-wallet"></i> Payments</a>
            <a href="#" onclick="handleLogout()" class="mobile-nav-item"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="nav-profile">
                <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Admin">
                <span class="nav-profile-name">Admin Portal</span>
            </div>
            <button class="btn btn-outline" style="border-color: var(--danger); color: var(--danger); padding: 0.5rem 1rem;" onclick="handleLogout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 class="admin-page-title" style="margin-bottom: 0;">Menu Management</h2>
            <a href="/admin/add-item.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add New Item</a>
        </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--info-bg); color: var(--info);"><i class="fa-solid fa-book-open"></i></div>
                    <div class="stat-content">
                        <h3 id="statTotalMenu">0</h3>
                        <p>Total Items</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fdf2f8; color: #db2777;"><i class="fa-solid fa-mug-saucer"></i></div>
                    <div class="stat-content">
                        <h3 id="statBreakfastItems">0</h3>
                        <p>Breakfast</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fffbeb; color: #d97706;"><i class="fa-solid fa-bowl-food"></i></div>
                    <div class="stat-content">
                        <h3 id="statLunchItems">0</h3>
                        <p>Lunch</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #f0fdf4; color: #16a34a;"><i class="fa-solid fa-cookie"></i></div>
                    <div class="stat-content">
                        <h3 id="statSnacksItems">0</h3>
                        <p>Snacks</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #eff6ff; color: #2563eb;"><i class="fa-solid fa-martini-glass-citrus"></i></div>
                    <div class="stat-content">
                        <h3 id="statBevItems">0</h3>
                        <p>Beverages</p>
                    </div>
                </div>
            </div>

            <div class="card" style="padding: 1.5rem;">
                <div class="filter-bar">
                    <input type="text" id="searchMenu" placeholder="Search menu items..." onkeyup="filterMenu()">
                    <select id="categoryFilter" onchange="filterMenu()">
                        <option value="all">All Categories</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Beverages">Beverages</option>
                    </select>
                </div>

                <div class="admin-table-container" style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="menuTableBody">
                            <!-- JS injected -->
                        </tbody>
                    </table>
                </div>
    </div>
    <!-- Custom Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="card" style="width: 100%; max-width: 400px; padding: 2rem; text-align: center; background: var(--bg-card);">
            <div style="font-size: 3rem; color: var(--danger); margin-bottom: 1rem;">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 style="margin-bottom: 0.5rem; font-size: 1.5rem; color: var(--text-main);">Delete Food Item?</h3>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Are you sure you want to delete this item? This action cannot be undone.</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-outline" id="btnCancelDelete" style="width: 100%;">Cancel</button>
                <button class="btn btn-primary" id="btnConfirmDelete" style="width: 100%; background: var(--danger); border-color: var(--danger);">Delete</button>
            </div>
        </div>
    </div>

    <!-- Reusable Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/js/common.js"></script><script src="/js/admin.js"></script>
</body>
</html>
