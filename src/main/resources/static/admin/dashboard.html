<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusBite</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/admin-layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!-- Common Navbar -->
    <div class="nav-overlay" onclick="toggleNav()"></div>
    <nav class="navbar">
        <button class="nav-toggle-btn" onclick="toggleNav()"><i class="fa-solid fa-bars"></i></button>
        <a href="/admin/dashboard.html" class="nav-brand" style="display: flex; align-items: center;">
            <img src="/images/logo.png" alt="CampusBite Logo" style="height: 65px;">
        </a>
        <div class="nav-links">
            <div class="sidebar-logo">
                <img src="/images/logo.png" alt="CampusBite Logo" style="height: 50px;">
                <button onclick="toggleNav()" style="background: transparent; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
            </div>
            <a href="/admin/dashboard.html" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="/admin/menu-management.html"><i class="fa-solid fa-burger"></i> Menu Management</a>
            <a href="/admin/orders.html"><i class="fa-solid fa-receipt"></i> Orders</a>
            <a href="/admin/payments.html"><i class="fa-solid fa-wallet"></i> Payments</a>
            <a href="#" onclick="handleLogout()" class="mobile-nav-item"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="nav-profile">
                <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Admin">
                <span class="nav-profile-name">Admin Portal</span>
            </div>
            <button class="btn btn-outline" style="border-color: var(--danger); color: var(--danger); padding: 0.5rem 1rem;" onclick="handleLogout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem;">
        <div class="admin-page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
            <h2 class="admin-page-title" style="margin: 0;">Dashboard Overview</h2>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <input type="date" id="customDateFilter" style="width: auto; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); font-family: inherit;">
                <select id="dateFilter" style="width: auto; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); font-family: inherit; font-weight: 500; background: white;">
                    <option value="all">All Time</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>
            </div>
        </div>
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--info-bg); color: var(--info);">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <div class="stat-value" id="statOrders">0</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--success-bg); color: var(--success);">
                        <i class="fa-solid fa-indian-rupee-sign"></i>
                    </div>
                    <div class="stat-value" id="statRevenue">â‚¹0</div>
                    <div class="stat-label">Total Revenue</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: #e0e7ff; color: #4f46e5;">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div class="stat-value" id="statPayments">0</div>
                    <div class="stat-label">Total Payments</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--warning-bg); color: var(--warning);">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div class="stat-value" id="statPending">0</div>
                    <div class="stat-label">Pending Orders</div>
                </div>
            </div>

            <div class="tables-grid">
                <!-- Recent Orders -->
                <div class="admin-card" style="padding: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3 style="margin:0;">Recent Orders</h3>
                        <a href="/admin/orders.html" style="font-size: 0.9rem; color: var(--primary); font-weight: 500;">View All</a>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Student</th>
                                    <th>Items</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recentOrdersBody">
                                <!-- JS injected -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Recent Payments -->
                <div class="admin-card" style="padding: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3 style="margin:0;">Recent Payments</h3>
                        <a href="/admin/payments.html" style="font-size: 0.9rem; color: var(--primary); font-weight: 500;">View All</a>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Pay ID</th>
                                    <th>Order ID</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="recentPaymentsBody">
                                <!-- JS injected -->
                            </tbody>
                        </table>
                    </div>
                </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
