<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - CampusBite</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Common Navbar -->
    <div class="nav-overlay" onclick="toggleNav()"></div>
    <nav class="navbar">
        <button class="nav-toggle-btn" onclick="toggleNav()"><i class="fa-solid fa-bars"></i></button>
        <a href="/student/menu" class="nav-brand" style="display: flex; align-items: center;">
            <img src="/images/logo.png" alt="CampusBite Logo" style="height: 65px;">
        </a>
        <div class="nav-links">
            <div class="sidebar-logo">
                <img src="/images/logo.png" alt="CampusBite Logo" style="height: 50px;">
                <button onclick="toggleNav()" style="background: transparent; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
            </div>
            <a href="/student/menu" class="active"><i class="fa-solid fa-utensils"></i> Menu</a>

            <a href="/student/my-orders"><i class="fa-solid fa-clipboard-list"></i> My Orders</a>
            <a href="/student/my-payments"><i class="fa-solid fa-wallet"></i> My Payments</a>
            <a href="/student/profile" class="mobile-nav-item"><i class="fa-regular fa-user"></i> Profile</a>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/student/cart" class="nav-cart" id="navCartLink">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="navCartCount">0</span>
            </a>
            <a href="/student/profile" style="text-decoration: none;">
                <div class="nav-profile">
                    <img src="https://ui-avatars.com/api/?name=Student&background=random" id="navProfilePic" alt="Profile">
                    <span class="nav-profile-name" id="navProfileName">Hi, Student 👋</span>
                </div>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="page-layout">
            <!-- Left Sidebar: Categories & Filters -->


            <!-- Main Content: Menu Grid -->
            <div class="main-content">
                <div class="menu-header">
                    <div>
                        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Menu</h1>
                        <p style="color: var(--text-muted);">Choose your favorite food from our delicious menu</p>
                    </div>
                    <div class="menu-filters">
                        <button class="filter-btn active" data-type="all">All</button>
                        <button class="filter-btn" data-type="breakfast">Breakfast</button>
                        <button class="filter-btn" data-type="lunch">Lunch</button>
                        <button class="filter-btn" data-type="snacks">Snacks</button>
                        <button class="filter-btn" data-type="beverages">Beverages</button>
                    </div>
                </div>

                <div class="grid-menu" id="menuGrid">
                    <!-- Food cards will be injected here via JS -->
                </div>

            </div>

            <!-- Right Sidebar: Quick Cart -->
            <div class="cart-sidebar" id="quickCartSidebar">
                <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px;">
                    <i class="fa-solid fa-lock" style="color: var(--text-light);"></i> 
                    Your Cart (<span id="quickCartCount">0</span>)
                </h3>

                <div id="quickCartItems" style="max-height: 400px; overflow-y: auto; margin-bottom: 1.5rem;">
                    <!-- Quick cart items injected here -->
                </div>

                <div style="border-top: 1px dashed var(--border-color); padding-top: 1rem; margin-bottom: 1.5rem;">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="quickCartSubtotal">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>GST (5%)</span>
                        <span id="quickCartGst">₹0.00</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="quickCartTotal" style="color: var(--primary);">₹0.00</span>
                    </div>
                </div>

                <a href="/student/cart" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                    <i class="fa-solid fa-cart-shopping"></i> View Cart
                </a>
                <a href="/student/checkout" class="btn btn-outline" style="width: 100%; justify-content: center;">
                    Proceed to Checkout <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Reusable Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Error Modal for Concurrency / Out of Stock -->
    <div id="errorModal" class="modal">
        <div class="modal-content" style="max-width: 450px; text-align: center; padding: 2rem;">
            <div style="color: var(--danger); font-size: 4rem; margin-bottom: 1rem;">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h2 style="margin-bottom: 1rem;">Oops! Item Unavailable</h2>
            <p id="errorModalMessage" style="color: var(--text-muted); margin-bottom: 2rem; line-height: 1.5;"></p>
            <button class="btn btn-primary" onclick="closeErrorModal()" style="width: 100%;">I Understand</button>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/student.js"></script>
</body>
</html>
