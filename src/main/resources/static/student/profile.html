<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CampusBite</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Common Navbar -->
    <div class="nav-overlay" onclick="toggleNav()"></div>
    <nav class="navbar">
        <button class="nav-toggle-btn" onclick="toggleNav()"><i class="fa-solid fa-bars"></i></button>
        <a href="/student/menu" class="nav-brand" style="display: flex; align-items: center;">
            <img src="/images/logo.png" alt="CampusBite Logo" style="height: 65px;">
        </a>
        <div class="nav-links">
            <div class="sidebar-logo">
                <img src="/images/logo.png" alt="CampusBite Logo" style="height: 50px;">
                <button onclick="toggleNav()" style="background: transparent; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
            </div>
            <a href="/student/menu"><i class="fa-solid fa-utensils"></i> Menu</a>

            <a href="/student/my-orders"><i class="fa-solid fa-clipboard-list"></i> My Orders</a>
            <a href="/student/my-payments"><i class="fa-solid fa-wallet"></i> My Payments</a>
            <a href="/student/profile" class="mobile-nav-item active"><i class="fa-regular fa-user"></i> Profile</a>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/student/cart" class="nav-cart" id="navCartLink">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="navCartCount">0</span>
            </a>
            <a href="/student/profile" style="text-decoration: none;">
                <div class="nav-profile">
                    <img src="https://ui-avatars.com/api/?name=Student&background=random" id="navProfilePic" alt="Profile">
                    <span class="nav-profile-name" id="navProfileName" style="color: var(--primary);">Hi, Student ðŸ‘‹</span>
                </div>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="profile-container">
            <div class="profile-card">
                <div class="profile-header"></div>
                <div class="profile-content">
                    <div class="profile-img-wrap">
                        <img src="" alt="Profile" class="profile-img" id="mainProfilePic">
                    </div>
                    
                    <h1 class="profile-name" id="profileName">Student Name</h1>
                    <div class="profile-college"><i class="fa-solid fa-graduation-cap"></i> Sri Sairam Engineering College</div>

                    <div class="profile-details">
                        <div class="detail-item">
                            <div class="detail-icon"><i class="fa-solid fa-envelope"></i></div>
                            <div class="detail-text">
                                <label>College Email</label>
                                <span id="profileEmail">student@sairamtap.edu.in</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-icon"><i class="fa-solid fa-phone"></i></div>
                            <div class="detail-text">
                                <label>Phone Number</label>
                                <span id="profilePhone">Not Provided</span>
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-outline" style="width: 100%; border-color: var(--danger); color: var(--danger);" onclick="logout()">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout Securely
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reusable Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/js/student.js"></script>
    <script>
        function logout() {
            let modal = document.getElementById('logoutConfirmModal');
            
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'logoutConfirmModal';
                modal.className = 'modal-overlay';
                modal.style.display = 'none';
                modal.style.position = 'fixed';
                modal.style.top = '0';
                modal.style.left = '0';
                modal.style.width = '100%';
                modal.style.height = '100%';
                modal.style.background = 'rgba(0,0,0,0.5)';
                modal.style.zIndex = '2000';
                modal.style.justifyContent = 'center';
                modal.style.alignItems = 'center';
                
                modal.innerHTML = `
                    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem; text-align: center; background: var(--bg-card); margin: 0 1rem;">
                        <div style="font-size: 3rem; color: var(--danger); margin-bottom: 1rem;">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </div>
                        <h3 style="margin-bottom: 0.5rem; font-size: 1.5rem; color: var(--text-main);">Confirm Logout</h3>
                        <p style="color: var(--text-muted); margin-bottom: 2rem;">Are you sure you want to log out of your account?</p>
                        <div style="display: flex; gap: 10px; justify-content: center;">
                            <button class="btn btn-outline" id="btnCancelLogout" style="width: 100%;">Cancel</button>
                            <button class="btn btn-primary" id="btnConfirmLogout" style="width: 100%; background: var(--danger); border-color: var(--danger);">Logout</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                
                document.getElementById('btnCancelLogout').addEventListener('click', () => {
                    modal.style.display = 'none';
                });
                
                document.getElementById('btnConfirmLogout').addEventListener('click', () => {
                    localStorage.removeItem('studentToken');
                    window.location.href = '/student/login';
                });
            }
            
            modal.style.display = 'flex';
        }
    </script>
</body>
</html>
