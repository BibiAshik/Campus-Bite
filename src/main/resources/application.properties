# =============================================
# APPLICATION IDENTITY
# =============================================
spring.application.name=CampusBite
# Default to local profile, override in Railway with APP_PROFILE=prod
spring.profiles.active=${APP_PROFILE:local}

# =============================================
# MYSQL DATABASE
# =============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# In production, this should ideally be validate or none, but update is common for simple apps.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# JWT CONFIGURATION
# =============================================
app.jwt.secret=${JWT_SECRET:CampusBiteSuperSecretKeyForJWTTokenGenerationMinimum64CharactersLongPaddingHere123}
# Token validity: 86400000ms = 24 hours
app.jwt.expiration=86400000

# =============================================
# RAZORPAY
# =============================================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# =============================================
# GOOGLE OAUTH2 (for Student Login)
# =============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# =============================================
# BUSINESS RULES
# =============================================
app.college-email-domain=@sairamtap.edu.in

# =============================================
# IMAGE UPLOAD
# =============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Railway persistent volume mount path
app.upload.dir=/app/uploads

# =============================================
# SERVER
# =============================================
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Static files
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Removed Redis Cache config
